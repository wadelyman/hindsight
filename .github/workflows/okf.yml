name: OKF Phase-4 gates

on:
  push:
    paths:
      - "hindsight-api-slim/hindsight_api/okf/**"
      - "hindsight-api-slim/hindsight_api/alembic/versions/**"
      - "hindsight-api-slim/tests/test_okf*.py"
      - "hindsight-api-slim/tools/okf_*.py"
      - ".github/workflows/okf.yml"
  pull_request:
    paths:
      - "hindsight-api-slim/hindsight_api/okf/**"
      - "hindsight-api-slim/hindsight_api/alembic/versions/**"
      - "hindsight-api-slim/tests/test_okf*.py"
      - "hindsight-api-slim/tools/okf_*.py"
  workflow_dispatch:

jobs:
  gates:
    name: OKF gates (${{ matrix.leg }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hindsight
          POSTGRES_PASSWORD: hindsight-dev
          POSTGRES_DB: hindsight
        options: >-
          --health-cmd "pg_isready -U hindsight -d hindsight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full gates: migration, DB-backed invariants, round-trip, latency.
          # Only the pgvector leg may claim DB-backed coverage.
          - leg: pgvector
            db_gates: true
          # Unit-only legs: no database is used. The C1 index-clause contract
          # (all four backends) runs here because it needs no extension at all.
          # These legs are named for what they run — they never claim to
          # provision vchord/pgvectorscale/scann.
          - leg: unit-only-vchord
            db_gates: false
          - leg: unit-only-pgvectorscale
            db_gates: false
          - leg: unit-only-scann
            db_gates: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: |
          pip install -e hindsight-api-slim
          pip install pytest pytest-asyncio pyyaml asyncpg

      - name: Unit tests (all test_okf_* — glob, new files picked up automatically)
        run: python -m pytest hindsight-api-slim/tests/ -k okf -q

      - name: Apply migrations (0041 + curation revision)
        if: matrix.db_gates
        env:
          HINDSIGHT_TEST_OKF_DSN: postgresql://hindsight:hindsight-dev@127.0.0.1:5432/hindsight
        run: |
          python - <<'PY'
          from hindsight_api.migrations import run_migrations
          run_migrations("postgresql://hindsight:hindsight-dev@127.0.0.1:5432/hindsight", schema="public")
          PY

      - name: Invariant tests (DB-backed; I4/I7/W9/C2/coalescing)
        if: matrix.db_gates
        env:
          HINDSIGHT_TEST_OKF_DSN: postgresql://hindsight:hindsight-dev@127.0.0.1:5432/hindsight
        run: python -m pytest hindsight-api-slim/tests/test_okf_invariants.py -q

      - name: OKF v0.2 conformance validator (I5)
        run: |
          if [ -d hindsight-api-slim/tests/fixtures/golden-bundle ]; then
            python hindsight-api-slim/tools/okf_validate.py hindsight-api-slim/tests/fixtures/golden-bundle
          else
            echo "no golden bundle fixture yet — skipping (validator runs on every live export)"
          fi

      - name: Start daemon for E2E gates
        id: daemon
        if: matrix.db_gates
        env:
          HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:hindsight-dev@127.0.0.1:5432/hindsight
          HINDSIGHT_API_LLM_PROVIDER: ${{ secrets.HINDSIGHT_API_LLM_PROVIDER }}
          HINDSIGHT_API_LLM_API_KEY: ${{ secrets.HINDSIGHT_API_LLM_API_KEY }}
        run: |
          if [ -z "$HINDSIGHT_API_LLM_API_KEY" ]; then
            echo "daemon_e2e=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::No LLM key in secrets — round-trip and latency E2E gates skipped by design (they need a live daemon). Unit + invariant gates above still ran."
          else
            echo "daemon_e2e=run" >> "$GITHUB_OUTPUT"
            (cd hindsight-api-slim && uvicorn hindsight_api.main:app --port 8888 &) 
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8888/health && break || sleep 2; done
          fi

      - name: Round-trip digest equality (I5)
        if: matrix.db_gates && steps.daemon.outputs.daemon_e2e == 'run'
        run: python hindsight-api-slim/tools/okf_roundtrip.py ci-src ci-roundtrip

      - name: I2 latency gate (p99 on/off <= 1.05)
        if: matrix.db_gates && steps.daemon.outputs.daemon_e2e == 'run'
        run: python hindsight-api-slim/tools/okf_latency_gate.py
